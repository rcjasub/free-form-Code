server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compress text responses — the JS bundle drops from ~2 MB to ~500 KB.
    # text/html is always included; woff2 and images are already compressed.
    # gzip_proxied any: still compress when the request came through Caddy.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml font/ttf;

    # Vite puts a content hash in every filename here, so a URL never changes
    # contents and browsers can keep it for a year without re-checking.
    location /assets/ {
        # A missing asset must 404 — falling back to index.html would get
        # that HTML cached for a year under a .js URL.
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # mime.types has no .ttf entry, so it would go out as
        # application/octet-stream and skip gzip
        location ~ \.ttf$ {
            types { font/ttf ttf; }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # React Router — serve index.html for all unmatched routes.
    # no-cache = store it but re-check every time (cheap 304 via ETag), so a
    # deploy's new asset hashes are picked up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy REST API calls to the backend
    location /api {
        set $backend_url ${BACKEND_URL};
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the address that reached nginx (Caddy, on the server) to the
        # client IP Caddy already put there — see "trust proxy" in server.ts.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Socket.IO (WebSocket + long-polling)
    location /socket.io {
        set $backend_url ${BACKEND_URL};
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
