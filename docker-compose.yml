services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    environment:
      POSTGRES_DB: freeformcode
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # from .env next to this file
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379" # reachable from this machine only
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "127.0.0.1:4000:4000" # the public way in is nginx (frontend)
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: freeformcode
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD} # from .env next to this file
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Code-execution sandbox for local development only. The "local" profile keeps
  # it out of a plain `docker compose up` — Piston has no ARM image, so the
  # Oracle VM never starts it. Start it with:
  #   docker compose --profile local up -d piston
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston
    profiles: ["local"]
    privileged: true # Piston needs it to sandbox each run
    ports:
      - "127.0.0.1:2000:2000" # reachable from this machine only
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    restart: unless-stopped

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  piston-packages:
